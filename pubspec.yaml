name: pdf_processor_flutter
description: PDF Processor Flutter App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # State Management
  flutter_riverpod: ^2.5.1

  # File Picker
  file_picker: ^10.3.3

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # Utils
  path_provider: ^2.1.3
  intl: ^0.19.0
  http_parser: ^4.1.2
  json_annotation: ^4.9.0
  google_fonts: ^6.3.2
  shimmer: ^3.0.0
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.0.0
  riverpod_annotation: ^2.6.1
  riverpod_generator: ^2.5.1  # Para @Riverpod
  build_runner: ^2.4.12  # Para generar .g.dart


  # PDF Viewer para gráficos/tablas/zoom
  syncfusion_flutter_pdfviewer: ^31.1.19
  go_router: ^16.2.5



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
